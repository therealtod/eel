[package]
name = "eel"
version = "0.1.0"
edition = "2024"

[features]
default = ["stall-quiescence", "quiescence-search"]
test-support = []
search-diagnostic = []
# Extend root-PV leaves with a quiescence tail so pending *signalled* plays resolve into real
# game_score before evaluation, rather than being estimated by the static `known_playable` term.
# This un-caps the horizon-saturated `game_score`, closing the banking artifact where a line that
# *defers* its plays banks extra leaf `known_playable` credit (at the leaf, settled lines show
# `+play = 0` because pending plays are cashed). Tail plays carry both the `play_deferral_weight`
# discount on `play_progress_bonus` *and* the `score_deferral_weight` discount on the realized
# `game_score`, so a play cashed now strictly beats one deferred/manufactured into the tail — without
# the latter, the arbitrage simply relocated past the leaf (cluing to manufacture tail-cashable
# plays out-scored cashing a guaranteed play now). On by default: the full test suite passes.
# See `quiescence_extend`/`quiescence_rollout` in `tree_action_selection_strategy.rs` and
# `DefaultEvaluator::score_deferral_weight`.
quiescence-search = []
# Experimental: terminate a simulated line at the first forced `LowLevelStall` ply and
# evaluate the pre-stall state statically, instead of simulating the stall and charging its
# consequences (wasted clue, trashed critical, or a Priority-3 "play slot 1" strike). A
# `LowLevelStall` only fires when no productive tech proposed a move, so it is a precise
# "out of real moves" signal — a horizon artifact of frozen information, not a real position.
# Cutting there stops the search from systematically over-penalising tempo/draw-heavy lines
# that hit the forced-stall wall earlier inside the horizon. On by default: the full test
# suite passes with it enabled (fixes the dry-position `should_prefer_finesse_if_no_drawback`
# horizon artifact) with no regressions and no runtime cost.
# See `is_forced_stall_leaf` in `tree_action_selection_strategy.rs`.
stall-quiescence = []

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
smallvec = "1.14.0"
clap = { version = "4.6.1", features = ["derive"] }
rayon = "1.12.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = { version = "0.10.1" }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "cookies", "native-tls-vendored"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
rustls = "0.23"
webpki-roots = "1.0.7"
futures-util = "0.3"
thiserror = "2"
urlencoding = "2.1"
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
log = "0.4.29"

[dev-dependencies]
mockall = "0.14.0"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
needless_pass_by_value = "allow"
