[package]
name = "eel"
version = "0.1.0"
edition = "2024"

[features]
test-support = []
search-diagnostic = []
# Experimental: extend root-PV leaves with a quiescence tail so pending *signalled*
# plays resolve into real game_score before evaluation, rather than being estimated by
# the static `known_playable` term. Tail plays carry the same deferred-play discount the
# in-horizon plies pay, so the extension never becomes a penalty-free zone. Off by default
# pending a cost/quiet-cap review before it can be promoted; the full test suite passes
# with it enabled. See `quiescence_extend` in `tree_action_selection_strategy.rs`.
quiescence-search = []

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
smallvec = "1.14.0"
clap = { version = "4.6.1", features = ["derive"] }
rayon = "1.12.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = { version = "0.10.1" }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "cookies", "native-tls-vendored"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
rustls = "0.23"
webpki-roots = "1.0.7"
futures-util = "0.3"
thiserror = "2"
urlencoding = "2.1"
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"

[dev-dependencies]
mockall = "0.14.0"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
needless_pass_by_value = "allow"
